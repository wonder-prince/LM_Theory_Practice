<!doctype html>
<!--
  教学说明：本文件用于实现本周实验中与该文件对应的可运行功能。
  阅读时先确认输入与路径，再观察核心处理和输出；修改后应重新运行对应步骤。
-->

<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>本地 7B 模型 Web 对话</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17212b;
      --muted: #64727f;
      --line: #d8e0e7;
      --paper: #f7f9fb;
      --panel: #ffffff;
      --blue: #1f5f91;
      --blue-soft: #e8f1f8;
      --green: #2d7654;
      --red: #a84444;
    }
    * { box-sizing: border-box; }
    html, body { overflow-x: hidden; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: var(--paper);
      font: 15px/1.55 "Segoe UI", "Microsoft YaHei", sans-serif;
    }
    .shell {
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr);
      min-height: 100vh;
      max-width: 1320px;
      margin: 0 auto;
      background: var(--panel);
    }
    aside {
      min-width: 0;
      padding: 28px 22px;
      border-right: 1px solid var(--line);
      background: #fbfcfd;
    }
    .brand {
      margin: 0 0 8px;
      font-size: 19px;
      font-weight: 700;
      letter-spacing: 0;
    }
    .subtitle, .hint, .meta { color: var(--muted); font-size: 13px; }
    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 24px 0;
      padding: 10px 12px;
      border: 1px solid var(--line);
      background: #fff;
    }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #9aa7b2; }
    .dot.ready { background: var(--green); }
    .dot.error { background: var(--red); }
    label { display: block; margin: 18px 0 6px; font-weight: 600; }
    textarea, input[type="number"] {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 5px;
      padding: 9px 10px;
      color: var(--ink);
      background: #fff;
      font: inherit;
    }
    textarea { min-height: 136px; resize: vertical; }
    input[type="range"] { width: 100%; accent-color: var(--blue); }
    .range-row { display: flex; align-items: center; gap: 10px; }
    .range-row input[type="range"] { flex: 1; width: auto; min-width: 0; }
    .range-value { min-width: 38px; color: var(--blue); font-variant-numeric: tabular-nums; }
    button {
      border: 1px solid var(--line);
      border-radius: 5px;
      padding: 9px 13px;
      color: var(--ink);
      background: #fff;
      font: inherit;
      cursor: pointer;
    }
    button:hover { border-color: var(--blue); color: var(--blue); }
    button.primary { border-color: var(--blue); color: #fff; background: var(--blue); }
    button.primary:hover { background: #174a71; }
    button:disabled { cursor: wait; opacity: .55; }
    main { display: flex; width: 100%; min-width: 0; flex-direction: column; }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 22px 30px;
      border-bottom: 1px solid var(--line);
    }
    h1 { margin: 0; font-size: 23px; letter-spacing: 0; }
    .endpoint { color: var(--muted); font: 12px/1.4 Consolas, monospace; }
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 28px max(24px, 5vw);
    }
    .message {
      max-width: 820px;
      margin: 0 auto 18px;
      padding: 14px 16px;
      border-left: 3px solid var(--line);
      background: #fff;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .message.user { border-left-color: var(--blue); background: var(--blue-soft); }
    .message.assistant { border-left-color: var(--green); }
    .message-label { margin-bottom: 5px; color: var(--muted); font-size: 12px; font-weight: 700; }
    .composer {
      padding: 16px max(24px, 5vw) 24px;
      border-top: 1px solid var(--line);
      background: #fff;
    }
    .composer-inner { max-width: 820px; margin: 0 auto; }
    #prompt { min-height: 74px; }
    .composer-actions { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 9px; }
    @media (max-width: 800px) {
      .shell { display: block; width: 100vw; max-width: 100vw; overflow: hidden; }
      aside, main { width: 100%; max-width: 100vw; min-width: 0; overflow: hidden; }
      aside { border-right: 0; border-bottom: 1px solid var(--line); }
      .status { margin: 14px 0; }
      label { margin-top: 12px; }
      textarea { min-height: 92px; }
      textarea, input { max-width: 100%; min-width: 0; }
      .range-row { display: grid; grid-template-columns: minmax(0, 1fr) 38px; }
      header { display: grid; grid-template-columns: minmax(0, 1fr) auto; padding: 18px 20px; }
      header > div { min-width: 0; }
      h1 { font-size: 21px; }
      #clear { flex: 0 0 auto; padding: 8px 10px; }
      #messages, .composer { padding-left: 16px; padding-right: 16px; }
      .message, .composer-inner { width: 100%; max-width: 100%; min-width: 0; }
      .endpoint { display: none; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <aside>
      <p class="brand">本地 7B 模型</p>
      <p class="subtitle">浏览器 → Web 服务 → 本地 API → GGUF</p>
      <div class="status"><span id="status-dot" class="dot"></span><span id="status-text">正在检查 API…</span></div>

      <label for="system-prompt">System prompt</label>
      <textarea id="system-prompt">你是《大模型原理与应用》课程助教。请用清晰、准确、适合大学生理解的中文回答问题，并结合已有对话保持上下文连贯。</textarea>

      <label for="temperature">Temperature</label>
      <div class="range-row"><input id="temperature" type="range" min="0" max="1" step="0.1" value="0.2"><span id="temperature-value" class="range-value">0.2</span></div>

      <label for="max-tokens">Max new tokens</label>
      <input id="max-tokens" type="number" min="16" max="512" step="16" value="160">

      <p class="hint">本页面不加载模型。模型只在 API 服务进程中加载一次。</p>
    </aside>

    <main>
      <header>
        <div>
          <h1>本地模型 Web 对话</h1>
          <div class="endpoint">POST /api/chat → http://127.0.0.1:18080/v1/chat/completions</div>
        </div>
        <button id="clear" type="button">清空对话</button>
      </header>

      <section id="messages" aria-live="polite"></section>

      <section class="composer">
        <div class="composer-inner">
          <textarea id="prompt" placeholder="输入问题，按 Ctrl+Enter 发送"></textarea>
          <div class="composer-actions">
            <span id="request-meta" class="meta">对话历史保存在当前浏览器页面内</span>
            <button id="send" class="primary" type="button">发送</button>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script>
    const state = { messages: [] };
    const messagesEl = document.querySelector('#messages');
    const promptEl = document.querySelector('#prompt');
    const sendEl = document.querySelector('#send');
    const statusDot = document.querySelector('#status-dot');
    const statusText = document.querySelector('#status-text');
    const temperatureEl = document.querySelector('#temperature');
    const temperatureValue = document.querySelector('#temperature-value');

    function addMessage(role, content) {
      const item = document.createElement('article');
      item.className = `message ${role}`;
      const label = document.createElement('div');
      label.className = 'message-label';
      label.textContent = role === 'user' ? '用户' : '本地模型';
      const text = document.createElement('div');
      text.textContent = content;
      item.append(label, text);
      messagesEl.appendChild(item);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function setStatus(ready, text) {
      statusDot.className = `dot ${ready ? 'ready' : 'error'}`;
      statusText.textContent = text;
    }

    async function checkStatus() {
      try {
        const response = await fetch('/api/status');
        const data = await response.json();
        if (!response.ok || !data.ready) throw new Error(data.error || 'API 未就绪');
        setStatus(true, '本地 API 已就绪');
      } catch (error) {
        setStatus(false, 'API 未就绪，请先启动模型服务');
      }
    }

    async function sendMessage() {
      const content = promptEl.value.trim();
      if (!content || sendEl.disabled) return;
      const userMessage = { role: 'user', content };
      state.messages.push(userMessage);
      addMessage('user', content);
      promptEl.value = '';
      sendEl.disabled = true;
      sendEl.textContent = '生成中…';
      const started = performance.now();
      try {
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            model: 'qwen2.5-7b-local',
            messages: [{ role: 'system', content: document.querySelector('#system-prompt').value }, ...state.messages],
            temperature: Number(temperatureEl.value),
            max_tokens: Number(document.querySelector('#max-tokens').value)
          })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || data.detail || `HTTP ${response.status}`);
        const answer = data.choices?.[0]?.message?.content?.trim();
        if (!answer) throw new Error('API 返回中没有回答文本');
        state.messages.push({ role: 'assistant', content: answer });
        addMessage('assistant', answer);
        document.querySelector('#request-meta').textContent = `本轮耗时 ${((performance.now() - started) / 1000).toFixed(1)} 秒`;
        setStatus(true, '本地 API 已就绪');
      } catch (error) {
        addMessage('assistant', `请求失败：${error.message}`);
        setStatus(false, 'API 请求失败');
      } finally {
        sendEl.disabled = false;
        sendEl.textContent = '发送';
        promptEl.focus();
      }
    }

    temperatureEl.addEventListener('input', () => { temperatureValue.textContent = temperatureEl.value; });
    sendEl.addEventListener('click', sendMessage);
    promptEl.addEventListener('keydown', event => {
      if (event.key === 'Enter' && event.ctrlKey) { event.preventDefault(); sendMessage(); }
    });
    document.querySelector('#clear').addEventListener('click', () => {
      state.messages.length = 0;
      messagesEl.replaceChildren();
      addMessage('assistant', '对话已清空。模型仍由本地 API 服务提供。');
      document.querySelector('#request-meta').textContent = '对话历史保存在当前浏览器页面内';
    });
    addMessage('assistant', '模型 Web 界面已打开。请先确认左侧显示“本地 API 已就绪”。');
    checkStatus();
  </script>
</body>
</html>
